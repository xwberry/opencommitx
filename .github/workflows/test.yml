name: Testing

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Unit Tests
        run: bun run test:unit
  e2e-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install git
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          git --version
      - name: Setup git
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Run E2E Tests
        run: bun run test:e2e
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Prettier
        run: bun run format:check
      - name: Prettier Output
        if: failure()
        run: |
          echo "Prettier check failed. Please run 'bun run format' to fix formatting issues."
          exit 1
